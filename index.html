<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAXX DRIFT 3D — PRASHANT MAXX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="creator-tag">
    <span class="pulse-dot"></span>
    <div class="creator-text">
      <span class="ai-label">AI // CREATOR</span>
      <span class="creator-name">PRASHANT MAXX</span>
    </div>
  </div>

  <div class="hud-top">
    <div class="stat-box">
      <span>SCORE</span>
      <b id="scoreVal">0</b>
    </div>
    <div class="stat-box">
      <span>CORES</span>
      <b id="coreVal">0</b>
    </div>
    <div class="stat-box">
      <span>SPEED</span>
      <b id="speedVal">0 KM/H</b>
    </div>
    <button class="mute-btn" id="muteBtn" onclick="toggleAudio()">🔊</button>
  </div>

  <div class="color-bar">
    <button style="background:#0ea5e9" onclick="setCarColor(0x0ea5e9)" title="Cyan"></button>
    <button style="background:#f43f5e" onclick="setCarColor(0xf43f5e)" title=" Crimson"></button>
    <button style="background:#10b981" onclick="setCarColor(0x10b981)" title="Emerald"></button>
    <button style="background:#f59e0b" onclick="setCarColor(0xf59e0b)" title="Gold"></button>
  </div>

  <div class="controls-hint">
    WASD / Arrows: Drive & Steer • Space: Boost • Drag: Orbit Camera
  </div>

  <div class="touch-pad">
    <button onpointerdown="setKey('ArrowLeft',true)" onpointerup="setKey('ArrowLeft',false)" onpointerleave="setKey('ArrowLeft',false)">◀</button>
    <button onpointerdown="setKey('ArrowUp',true)" onpointerup="setKey('ArrowUp',false)" onpointerleave="setKey('ArrowUp',false)">▲</button>
    <button onpointerdown="setKey('Space',true)" onpointerup="setKey('Space',false)" onpointerleave="setKey('Space',false)">⚡</button>
    <button onpointerdown="setKey('ArrowRight',true)" onpointerup="setKey('ArrowRight',false)" onpointerleave="setKey('ArrowRight',false)">▶</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="audio.js"></script>
  <script src="arena.js"></script>
  <script src="script.js"></script>
</body>
</html>
