<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PRASHANT THAR 3D — City Drive | PRASHANT MAXX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="creator-tag">
    <span class="pulse-dot"></span>
    <div class="creator-text">
      <span class="ai-label">AI // CREATOR</span>
      <span class="creator-name">PRASHANT MAXX</span>
    </div>
  </div>

  <div class="hud-top">
    <div class="stat-box">
      <span>SCORE</span>
      <b id="scoreVal">0</b>
    </div>
    <div class="stat-box">
      <span>TOKENS</span>
      <b id="coreVal">0</b>
    </div>
    <div class="stat-box">
      <span>SPEED</span>
      <b id="speedVal">0 KM/H</b>
    </div>
    <button class="mute-btn" id="muteBtn" onclick="toggleAudio()">🔊</button>
  </div>

  <!-- Left Side: BRAKE Pedal -->
  <div class="left-pedals">
    <button
      class="pedal-btn brake-pedal"
      onpointerdown="setKey('ArrowDown',true)"
      onpointerup="setKey('ArrowDown',false)"
      onpointerleave="setKey('ArrowDown',false)"
      onpointercancel="setKey('ArrowDown',false)"
    >
      <span class="pedal-holes"></span>
      <b>BRAKE</b>
    </button>
  </div>

  <!-- Right Side: BACK/BOOST Pedal right beside FRONT/GAS Pedal -->
  <div class="right-pedals">
    <button
      class="pedal-btn back-pedal"
      onpointerdown="setKey('Space',true)"
      onpointerup="setKey('Space',false)"
      onpointerleave="setKey('Space',false)"
      onpointercancel="setKey('Space',false)"
    >
      <span class="pedal-holes"></span>
      <b>BOOST</b>
    </button>
    <button
      class="pedal-btn gas-pedal"
      onpointerdown="setKey('ArrowUp',true)"
      onpointerup="setKey('ArrowUp',false)"
      onpointerleave="setKey('ArrowUp',false)"
      onpointercancel="setKey('ArrowUp',false)"
    >
      <span class="pedal-holes"></span>
      <b>GAS</b>
    </button>
  </div>

  <!-- Optional Steering Bar above bottom pedals -->
  <div class="steer-bar">
    <button
      onpointerdown="setKey('ArrowLeft',true)"
      onpointerup="setKey('ArrowLeft',false)"
      onpointerleave="setKey('ArrowLeft',false)"
      onpointercancel="setKey('ArrowLeft',false)"
    >◀ LEFT</button>
    <button
      onpointerdown="setKey('ArrowRight',true)"
      onpointerup="setKey('ArrowRight',false)"
      onpointerleave="setKey('ArrowRight',false)"
      onpointercancel="setKey('ArrowRight',false)"
    >RIGHT ▶</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="audio.js"></script>
  <script src="arena.js"></script>
  <script src="script.js"></script>
</body>
</html>
